name: Deploy Mooncatch to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'index.html'
      - '.nojekyll'
      - 'tests/**'
      - 'scripts/build-3d.cjs'
      - 'package*.json'
      - '.github/workflows/pages.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci
      - name: Verify game
        run: |
          node --check dist/game.js
          node tests/game.cjs
          node tests/expansion.cjs
          node tests/voyages.cjs
          node tests/profile.cjs
          node tests/mobile.cjs
          node tests/echo.cjs
          node tests/replay.cjs
          node tests/suite.cjs
          node tests/guide.cjs
          node tests/guide-integration.cjs
          node tests/echo-audio.cjs
          node tests/puzzle-render-state.cjs
          test -f dist/index.html
      - name: Build standalone game
        run: npm run build:web
      - name: Verify branch and Actions entry points match
        run: git diff --exit-code -- index.html .nojekyll audio echo guide.js scene3d.js flight-bridge.js art-direction.css THIRD_PARTY_LICENSES.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
